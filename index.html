<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WiFi del Estudio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    h1 { font-size: 1.4rem; font-weight: 600; }
    .net { color: var(--accent); margin-top: 8px; font-size: 1.1rem; }
    .week { color: var(--muted); margin-top: 4px; font-size: .9rem; }
    .pw {
      margin: 28px 0;
      font-size: 1.7rem;
      letter-spacing: 2px;
      font-weight: 700;
      word-break: break-all;
    }
    .pw.pending { color: var(--muted); font-size: 1rem; }
    .row { display: flex; gap: 12px; margin-top: 12px; }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s;
    }
    button:hover { filter: brightness(1.1); }
    .copy { background: var(--accent); color: #082f49; }
    .connect { background: var(--ok); color: #022c22; }
    .hint { color: var(--muted); font-size: .8rem; margin-top: 18px; line-height: 1.5; }
    .updated { color: #64748b; font-size: .72rem; margin-top: 14px; }
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--ok); color: #022c22;
      padding: 10px 20px; border-radius: 30px; font-weight: 600;
      transition: transform .25s; opacity: 0;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <main class="card">
    <h1>WiFi del Estudio</h1>
    <div class="net" id="net">Cargando red…</div>
    <div class="week" id="week"></div>
    <div class="pw pending" id="pw">Cargando contraseña…</div>
    <div class="row">
      <button class="copy" id="copy" disabled>Copiar</button>
      <button class="connect" id="connect" disabled>Conectar</button>
    </div>
    <p class="hint">En iPhone pulsa "Copiar" y pégala en la contraseña de la red. En Android usa "Conectar".</p>
    <div class="updated" id="updated"></div>
  </main>
  <div id="toast">Copiado</div>
  <script src="wifi.js"></script>
</body>
</html>
